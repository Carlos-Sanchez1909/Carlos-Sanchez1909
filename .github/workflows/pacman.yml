name: Generate Pac-Man Animation

on:
  # Se ejecuta automáticamente cada 24 horas
  schedule:
    - cron: "0 0 * * *"
  
  # Permite ejecutarlo manualmente desde la pestaña "Actions"
  workflow_dispatch:
    
  # Se ejecuta cada vez que haces un commit en la rama main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Descarga tu repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Genera la animación con estilo Pac-Man / puntos
      - name: Generate pacman-contribution files
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          # Aquí configuramos los colores y el estilo tipo Pac-Man (comiendo puntos)
          svg_out_path: dist/output.svg

      # 3. Muestra el estado del commit
      - name: Show git status
        run: git status

      # 4. Sube los archivos generados a una rama especial llamada 'output'
      - name: Push generated files to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update pacman contribution animation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
